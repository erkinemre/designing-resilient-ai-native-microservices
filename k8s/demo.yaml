apiVersion: v1
kind: Namespace
metadata: {name: aether-demo}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: aether-demo}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rabbit-data, namespace: aether-demo}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: aether-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16.6
          env:
            - {name: POSTGRES_USER, value: aether}
            - {name: POSTGRES_PASSWORD, value: aether_dev_only}
            - {name: POSTGRES_DB, value: aether}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", "aether", "-d", "aether"]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: aether-demo}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: aether-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: aether}
            - {name: RABBITMQ_DEFAULT_PASS, value: aether_dev_only}
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          readinessProbe: {exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: rabbit-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: aether-demo}
spec: {selector: {app: rabbitmq}, ports: [{name: amqp, port: 5672}, {name: management, port: 15672}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aether-api, namespace: aether-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: aether-api}}
  template:
    metadata: {labels: {app: aether-api}}
    spec:
      containers:
        - name: api
          image: aether-api:local
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: api}
            - {name: ConnectionStrings__Postgres, value: "Host=postgres;Database=aether;Username=aether;Password=aether_dev_only"}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: aether-api, namespace: aether-demo}
spec: {selector: {app: aether-api}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory-worker, namespace: aether-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-worker}}
  template:
    metadata: {labels: {app: inventory-worker}}
    spec:
      containers:
        - name: worker
          image: aether-api:local
          imagePullPolicy: Never
          env:
            - {name: ROLE, value: worker}
            - {name: ConnectionStrings__Postgres, value: "Host=postgres;Database=aether;Username=aether;Password=aether_dev_only"}
            - {name: RABBITMQ_URL, value: "amqp://aether:aether_dev_only@rabbitmq:5672/"}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: aether-demo}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: aether-api
        metrics_path: /metrics
        static_configs:
          - targets: ["aether-api:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: aether-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: aether-demo}
spec: {selector: {app: prometheus}, ports: [{port: 9090}]}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: inventory-worker-scaling, namespace: aether-demo}
spec:
  scaleTargetRef: {name: inventory-worker}
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 180
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        mode: QueueLength
        value: "20"
        queueName: inventory.reserve
        hostFromEnv: RABBITMQ_URL
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        query: aether_predicted_backlog
        threshold: "20"
        activationThreshold: "0"
